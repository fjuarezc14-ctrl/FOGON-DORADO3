version: '3.8'

name: fogon-dorado-3

services:
  # --- Frontend: React/Vite ---
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5176:5176"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  # --- Backend: Node.js/Express ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env          # Lee TODAS las variables desde el archivo .env del backend
    environment:
      - DATABASE_URL=postgresql://fogon_user:fogon_password@db:5432/fogon_dorado
      - PORT=3002
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # --- Base de Datos: PostgreSQL ---
  db:
    image: postgres:16-alpine
    ports:
      - "5439:5432"

    environment:
      - POSTGRES_USER=fogon_user
      - POSTGRES_PASSWORD=fogon_password
      - POSTGRES_DB=fogon_dorado
    volumes:
      - postgres_data_3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fogon_user -d fogon_dorado"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_3:
